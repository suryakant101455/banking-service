spring:
  application:
    name: banking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shdbank
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: banking
    default-schema: banking